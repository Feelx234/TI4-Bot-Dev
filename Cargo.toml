[workspace]
resolver = "2"
members = [
    "crates/ti4-chance",
    "crates/ti4-model",
    "crates/ti4-content",
    "crates/ti4-engine",
    "crates/ti4-engine-next",
    "crates/ti4-engine-core",
    "crates/ti4-engine-core-factions",
    "crates/ti4-engine-core-setup",
    "crates/ti4-engine-core-bridge",
    "crates/ti4-perf-alloc",
    "crates/ti4-engine-core-tests",
    "crates/ti4-policy",
    "crates/ti4-sim",
    "crates/ti4-calc",
    "crates/ti4-training",
    "crates/ti4-bridge",
    "crates/ti4-legacy",
    "crates/ti4-cli",
    "crates/ti4-tensor",
    "crates/ti4-mlp",
    "crates/ti4-review",
    "crates/ti4-host",
    "crates/ti4-server",
    "crates/ti4-advisor",
    "crates/ti4-bot-agent",
    "crates/ti4-rule-bot",
    "crates/ti4-rule-bot-typed",
    "crates/ti4-selfplay",
    "crates/ti4-replayer",
    "crates/ti4-wasm",
    "crates/ti4-mcts-features",
    "crates/ti4-mcts-lab",
    "crates/ti4-mcts-net",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
# Internal
# The bottom crate of the randomness (docs/FORK_RNG_THEORY.md 4.1): names no ti4- crate.
ti4-chance = { path = "crates/ti4-chance" }
ti4-model = { path = "crates/ti4-model" }
ti4-content = { path = "crates/ti4-content" }
# The product-facing engine crate: a thin package in `crates/ti4-engine-next` (docs/todo/D2-7-legacy-split.md). Facade stage: it re-exports the legacy.
ti4-engine = { path = "crates/ti4-engine-next" }
# The string engine (the directory keeps its old name `crates/ti4-engine`): tests and comparison oracle, never production after the flip.
ti4-engine-legacy = { path = "crates/ti4-engine" }
ti4-engine-core = { path = "crates/ti4-engine-core" }
ti4-engine-core-factions = { path = "crates/ti4-engine-core-factions" }
ti4-engine-core-setup = { path = "crates/ti4-engine-core-setup" }
ti4-engine-core-tests = { path = "crates/ti4-engine-core-tests" }
ti4-policy = { path = "crates/ti4-policy" }
ti4-sim = { path = "crates/ti4-sim" }
ti4-calc = { path = "crates/ti4-calc" }
ti4-training = { path = "crates/ti4-training" }
ti4-bridge = { path = "crates/ti4-bridge" }
ti4-legacy = { path = "crates/ti4-legacy" }
ti4-cli = { path = "crates/ti4-cli" }
ti4-tensor = { path = "crates/ti4-tensor" }
ti4-mlp = { path = "crates/ti4-mlp" }
ti4-review = { path = "crates/ti4-review", default-features = false }
ti4-host = { path = "crates/ti4-host" }
ti4-server = { path = "crates/ti4-server" }
ti4-advisor = { path = "crates/ti4-advisor" }
ti4-bot-agent = { path = "crates/ti4-bot-agent" }
ti4-rule-bot = { path = "crates/ti4-rule-bot" }
ti4-rule-bot-typed = { path = "crates/ti4-rule-bot-typed" }
ti4-replayer = { path = "crates/ti4-replayer" }
xtask = { path = "crates/xtask" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_stacker = "0.1"
bincode = "2"
sha2 = "0.10"
unicode-normalization = "0.1"
blake2 = "0.10"
hex = "0.4"
flate2 = "1"
zstd = "0.13"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rand_chacha = "0.9"
parquet = "55"
# Pinned exactly: tch 0.22.0 is the release built against libtorch 2.9.x, which is what
# plans/artifacts/libtorch-2.9.1-cpu.manifest.json pins. Newer tch requires libtorch 2.13 (M09-025).
tch = "=0.22.0"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
anyhow = "1"
itertools = "0.14"
rayon = "1.11"
mimalloc = { version = "0.1", default-features = false }
smallvec = { version = "1", features = ["const_generics", "const_new"] }
hashbrown = "0.15"
indexmap = "2"
bitflags = { version = "2", features = ["std"] }
enumset = "1.1.5"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
proptest = "1.6"
# TypeScript types of the wire (`ts` features of ti4-model, ti4-engine (forwarded to ti4-engine-legacy), ti4-calc, ti4-host, ti4-wasm).
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
# Keep GTK/Wayland defaults off; XDG Portal is the Linux backend and builds on WSL without GTK.
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6", "xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
# Denied, not warned: a second `#[test]` on one function is always a test inserted between an
# existing attribute and the function it belonged to, which silently stops the *other* test
# running. It happened three times on this branch alone and the warning went unread each time.
duplicate_macro_attributes = "deny"

[workspace.lints.clippy]
# Keep Clippy focused on correctness and runtime performance; opt into type complexity explicitly.
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
type_complexity = "warn"
# The `cargo` group checks publishability — description, license, keywords, categories. These
# crates are a private workspace and are not published, so it only ever produces noise.
cargo = { level = "allow", priority = -1 }

# Dropped `nursery`: across this project's history it produced no finding that was a defect,
# while costing a round-trip each time on code that was already correct and tested. Every real
# bug so far was caught by a test, not a lint.
#
# These three fire on shapes the rules genuinely have. A combat step needs the state, the corpus
# it is read against, both halves of the pinned random source, and both sides; bundling them to
# satisfy a counter would hide which of them the step mutates.
too_many_arguments = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# A data model with hundreds of accessors does not benefit from `#[must_use]` on each; the
# attribute stops meaning anything once it is everywhere.
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The gate profile (docs/ENGINE_BUILD_SPEED.md): the same optimized code generation as release for
# speed of the binaries, without the whole-program work that makes release builds slow (no LTO,
# parallel codegen, no debug info, incremental). Decision hashes and bench results do not depend on
# the profile. `cargo build --profile gate ...`; binaries land in `$CARGO_TARGET_DIR/gate/`.
[profile.gate]
inherits = "release"
lto = "off"
codegen-units = 16
debug = 0
incremental = true
opt-level = 3

# Lighter test profiles (docs/ENGINE_COMPUTE.md 3): for `cargo test` loops where compile time matters
# more than binary speed. Not used by verify_package.sh (that stays on `gate`). Results of the tests are
# identical; only the generated code differs. `cargo test --profile lockstep -p ti4-engine-legacy --lib`.
# lockstep: gate with opt-level 1 (still inlines small functions, a fraction of the codegen time).
[profile.lockstep]
inherits = "gate"
opt-level = 1
codegen-units = 64
# lockstep0: no optimization of the workspace crates, debug assertions OFF as in gate (so the
# overflow checks match the gate results); dependencies stay at opt-level 3 (hash/zstd/serde speed).
[profile.lockstep0]
inherits = "gate"
opt-level = 0
codegen-units = 256
[profile.lockstep0.package."*"]
opt-level = 3

# The browser build: size first. `cargo build -p ti4-wasm --target wasm32-unknown-unknown
# --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"

# The browser build for development: `web-shared/scripts/build-wasm.mjs <out.wasm> --dev`
# (`web2/scripts/build-wasm.sh --dev`). Not optimized and
# incremental, so a change of the engine is rebuilt in seconds; the file is about three times the
# size of the release build and the engine is slower in the page. `panic = "abort"` as in the
# release build, so a panic looks the same in both.
[profile.wasm-dev]
inherits = "dev"
opt-level = 0
debug = false
# Without the names of the functions the file is much smaller, and it loads faster.
strip = true
panic = "abort"
incremental = true

[profile.dev]
# Line numbers in backtraces, nothing else. Full debuginfo was copied into every test executable's
# .dwp: 6 GB of a 17 GB target directory. For a debugger session use `--profile debugger`.
debug = "line-tables-only"
split-debuginfo = "packed"

# Third-party dependencies are compiled with optimization even in the dev and test profiles, while
# every workspace crate stays a plain debug build (opt-level 0, debug assertions and overflow checks
# ON; `"*"` matches only non-workspace-member packages). The server's hot paths run through
# serde_json, sha2/blake2, zstd/flate2, rand, hashbrown and tokio/axum; optimizing them roughly
# halves save_history/load_history and the per-decision commit wait without touching the debug
# checks of our own code. `debug = false` drops dependency debug info (smaller target dir and
# faster links); backtraces keep file:line for our code. Profile settings do not change Cargo.lock.
# `"*"` also matches proc-macro crates and build-script dependencies (it beats `build-override`);
# those are put back to opt-level 0 below.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Measured (docs/BUILD_SIZES_AND_TIMES.md): `package."*"` takes precedence over `build-override`, so
# the proc-macro crates and the libraries only they use (syn twice, proc-macro2, quote, darling,
# serde_derive, the icu derives, ...) were compiled with opt-level 3 too: code that only ever runs
# inside rustc, and a large share of a clean build's CPU time. A specific package beats `"*"`,
# so they are listed here at opt-level 0, the proc-macro crates of the whole lock file. A new
# proc-macro crate in the tree costs only compile time until it is added.
[profile.dev.package]
async-recursion.opt-level = 0
async-trait.opt-level = 0
bincode_derive.opt-level = 0
bumpalo.opt-level = 0
bytemuck_derive.opt-level = 0
const-random-macro.opt-level = 0
darling.opt-level = 0
darling_core.opt-level = 0
darling_macro.opt-level = 0
displaydoc.opt-level = 0
document-features.opt-level = 0
enumflags2_derive.opt-level = 0
enumset_derive.opt-level = 0
fnv.opt-level = 0
foreign-types-macros.opt-level = 0
futures-macro.opt-level = 0
heck.opt-level = 0
ident_case.opt-level = 0
jni-macros.opt-level = 0
jni-sys-macros.opt-level = 0
litrs.opt-level = 0
num_enum_derive.opt-level = 0
paste.opt-level = 0
phf_generator.opt-level = 0
phf_macros.opt-level = 0
pin-project-internal.opt-level = 0
proc-macro-crate.opt-level = 0
proc-macro2.opt-level = 0
quick-xml.opt-level = 0
quote.opt-level = 0
rustc_version.opt-level = 0
rustversion.opt-level = 0
semver.opt-level = 0
seq-macro.opt-level = 0
serde_derive.opt-level = 0
serde_repr.opt-level = 0
strum_macros.opt-level = 0
syn.opt-level = 0
synstructure.opt-level = 0
termcolor.opt-level = 0
thiserror-impl.opt-level = 0
tiny-keccak.opt-level = 0
tokio-macros.opt-level = 0
toml_datetime.opt-level = 0
toml_edit.opt-level = 0
toml_parser.opt-level = 0
tracing-attributes.opt-level = 0
ts-rs-macros.opt-level = 0
unicode-ident.opt-level = 0
virtue.opt-level = 0
wasm-bindgen-macro.opt-level = 0
wasm-bindgen-macro-support.opt-level = 0
wayland-scanner.opt-level = 0
winapi-util.opt-level = 0
windows-implement.opt-level = 0
windows-interface.opt-level = 0
yoke-derive.opt-level = 0
zbus-lockstep-macros.opt-level = 0
zbus_macros.opt-level = 0
zerocopy-derive.opt-level = 0
zerofrom-derive.opt-level = 0
zerovec-derive.opt-level = 0
zvariant_derive.opt-level = 0

[profile.debugger]
inherits = "dev"
debug = "full"

[package]
name = "ti4-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The product-facing engine crate: native, independent of ti4-engine-legacy unless the dev-tool feature lend-string is on (docs/D29B_RESUME.md)."

[dependencies]
# Dev-tool surface only: reached through the `lend-string` feature (module `lend_string`), never by a production crate.
ti4-engine-legacy = { workspace = true, optional = true }
# Lane A (D2-8b): the glue and the wire types copied out of the legacy crate need the same dependencies as the legacy crate.
ti4-model.workspace = true
ti4-content.workspace = true
ti4-engine-core.workspace = true
# The chance resolver (docs/FORK_RNG_THEORY.md 4.4): every arm and the reconcile run through it; no chance question reaches a decider.
ti4-engine-chance.workspace = true
ti4-chance.workspace = true
ti4-engine-core-factions.workspace = true
ti4-engine-core-setup.workspace = true
serde.workspace = true
serde_json.workspace = true
rand = { version = "0.9", default-features = false }
rand_chacha.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# No default feature reaches `ti4-engine-legacy` (tools/engine_core/check_production_graph.sh checks it).
default = []
ts = ["dep:ts-rs", "ti4-model/ts"]
# The dev-tool surface: the legacy (string) engine as a dependency, `lend_string` module. Research tools, the bridge and the tests that drive
# a string window turn it on; no production crate does.
lend-string = ["dep:ti4-engine-legacy"]
# The production crates (host, server, wasm, rule-bot) turn this on on their edge; combined with `lend-string` the build stops (lib.rs).
production = []
# Legacy knobs, forwarded for the dev tools (each implies `lend-string`).
typed-core = ["lend-string", "ti4-engine-legacy/typed-core"]
observed-count = ["lend-string", "ti4-engine-legacy/observed-count"]
native-subject = ["lend-string", "ti4-engine-legacy/native-subject"]
string-movement = ["lend-string", "ti4-engine-legacy/string-movement"]
string-objectives = ["lend-string", "ti4-engine-legacy/string-objectives"]
string-factions = ["lend-string", "ti4-engine-legacy/string-factions"]
string-trade = ["lend-string", "ti4-engine-legacy/string-trade"]
string-exploration = ["lend-string", "ti4-engine-legacy/string-exploration"]
string-strategy = ["lend-string", "ti4-engine-legacy/string-strategy"]
string-action-cards = ["lend-string", "ti4-engine-legacy/string-action-cards"]
string-agenda = ["lend-string", "ti4-engine-legacy/string-agenda"]

[dev-dependencies]
proptest.workspace = true
zstd.workspace = true
# Lane B: the surface parity tests play legacy games on real maps (`ti4_host::map::create_game_with_template`).
ti4-host.workspace = true
# The unit tests and the parity tests build legacy positions and compare with the string originals (never linked into a product build).
ti4-engine-legacy = { workspace = true, features = ["ts"] }

[lints]
workspace = true

[package]
name = "ti4-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ti4-model.workspace = true
ti4-content.workspace = true
serde.workspace = true
serde_json.workspace = true
# No default features: they pull `getrandom`, which has no `wasm32-unknown-unknown` backend, and
# the engine only ever draws from seeded streams.
rand = { version = "0.9", default-features = false }
rand_chacha.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
# The typed core (docs/ENGINE_CORE.md), behind `typed-core` (on by default).
ti4-engine-core = { workspace = true, optional = true }
ti4-engine-core-factions = { workspace = true, optional = true }

# The TypeScript types of the wire (`ti4_wasm::wire_ts`); off but in the tests of the browser game.
[features]
ts = ["dep:ts-rs", "ti4-model/ts"]
# Movement and adjacency answered by the typed core (`core_adapter`; docs/ENGINE_CORE.md). On by
# default; same answers by construction and by the dual run (`core_equivalence`).
default = ["typed-core"]
typed-core = ["dep:ti4-engine-core", "dep:ti4-engine-core-factions"]
# The off switch: with it, every call site uses the string search again although `typed-core`
# (a default feature, which a dependent cannot turn off) is compiled in. For A/B and spot checks:
# `cargo build -p ti4-selfplay --features ti4-engine/string-movement`.
string-movement = []

[dev-dependencies]
strum.workspace = true
proptest.workspace = true
zstd.workspace = true

[lints]
workspace = true

[package]
name = "ti4-engine-core-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Prototype adapter (docs/ENGINE_CORE.md): string ids <-> the typed core for the movement slice, its equivalence tests and benchmark."

[dependencies]
ti4-engine-core.workspace = true
ti4-engine-core-setup.workspace = true
ti4-model.workspace = true
ti4-content.workspace = true
# The string engine, the oracle's reference side (always, with its test accessors); the product crate is the thin `ti4-engine`.
ti4-engine-legacy = { workspace = true, features = ["typed-core", "native-subject"] }
ti4-engine = { workspace = true }
strum.workspace = true
# The golden games and the benchmark play bot games exactly as `selfplay run` does.
ti4-selfplay = { path = "../ti4-selfplay" }
ti4-rule-bot.workspace = true
# The typed bot (D3) and its shadow harness `shadow` / `bot_shadow`.
ti4-rule-bot-typed.workspace = true
rand.workspace = true
rand_chacha.workspace = true
ti4-host.workspace = true
# The alpha round trip reads a server data directory through `Storage` (the server does not depend on the bridge).
ti4-server.workspace = true
ti4-wasm = { path = "../ti4-wasm" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zstd.workspace = true
mimalloc.workspace = true
ti4-perf-alloc = { path = "../ti4-perf-alloc" }

[dev-dependencies]
# The draw census of `tests/fork_core.rs` (lane C0, docs/C0_RESUME.md): thread-local counters, only in this crate's test builds.
ti4-engine-core = { workspace = true, features = ["probe-counters"] }
# The mid-step fork tests of `tests/fork_mid.rs` (lane C5, docs/C5_RESUME.md): `Game::pull` / `Game::answer`.
ti4-engine = { workspace = true, features = ["search"] }

[features]
# `perf_kernel`: the counting allocator (counts, bytes, live, peak) instead of plain mimalloc.
perf-count = []
# Count the view calls of the string bot per decision subtype (`ti4_model::count`); `bot_shadow` prints them.
observed-count = ["ti4-engine-legacy/observed-count", "ti4-model/observed-count"]

[lints]
workspace = true

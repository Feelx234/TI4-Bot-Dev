[package]
name = "ti4-engine-core-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Prototype adapter (docs/ENGINE_CORE.md): string ids <-> the typed core for the movement slice, its equivalence tests and benchmark."

[dependencies]
ti4-engine-core.workspace = true
ti4-model.workspace = true
ti4-content.workspace = true
ti4-engine = { workspace = true, features = ["typed-core"] }
strum.workspace = true
# The golden games and the benchmark play bot games exactly as `selfplay run` does.
ti4-selfplay = { path = "../ti4-selfplay" }
ti4-rule-bot.workspace = true
# The typed bot (D3) and its shadow harness `shadow` / `bot_shadow`.
ti4-rule-bot-typed.workspace = true
rand.workspace = true
rand_chacha.workspace = true
ti4-host.workspace = true
# The alpha round trip reads a server data directory through `Storage` (the server does not depend on the bridge).
ti4-server.workspace = true
ti4-wasm = { path = "../ti4-wasm" }
serde_json.workspace = true
sha2.workspace = true
zstd.workspace = true
mimalloc.workspace = true

[features]
# Count the view calls of the string bot per decision subtype (`ti4_model::count`); `bot_shadow` prints them.
observed-count = ["ti4-engine/observed-count", "ti4-model/observed-count"]

[lints]
workspace = true

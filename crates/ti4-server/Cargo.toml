[package]
name = "ti4-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ti4-model = { workspace = true }
ti4-content = { workspace = true }
ti4-engine = { workspace = true, features = ["production"] }
ti4-rule-bot = { workspace = true }
ti4-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
hex = { workspace = true }
futures-util = "0.3"
sha2 = { workspace = true }

[dev-dependencies]
# Tests and examples that drive the string windows (oracle only; never in the production tree).
ti4-engine-legacy.workspace = true
# The wasm host as a native library, for the test that both hosts play the same game.
# Its `ts` feature: the tests write and check the TypeScript types of the wire. A dev-dependency,
# so every alias of `.cargo/config.toml` builds the same features and the server binary has none.
ti4-wasm = { path = "../ti4-wasm", features = ["ts"] }
tokio-tungstenite = "0.26"
# Held at 1.1.0 on purpose: 1.2 swaps the unicode-rs crates for the ICU4X stack (icu_*, yoke, zerovec,
# displaydoc, ... about 30 crates and 4 proc-macro crates) that reqwest -> url -> idna would
# otherwise compile for a test client that only ever opens http://127.0.0.1. Nothing is linked into
# the server binary either way. Not used by any source file.
idna_adapter = "=1.1.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# The binary has no tests; without this it is linked a second time as an empty test executable.
[[bin]]
name = "server"
path = "src/bin/server.rs"
test = false

[package]
name = "ti4-mcts-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "MCTS bot network inference (docs/MCTS_BOT_PLAN.md 3.4, lane L4): the .t4w weights loader and the forward pass of the policy + value net of tools/mcts (parity with the NumPy reference). A research crate: never in the production graph or the wasm."

[[bin]]
name = "mcts_net_bench"
path = "src/bin/mcts_net_bench.rs"

# The features (the `Encoded` record the net reads) and the JSON header of the weights file.
[dependencies]
ti4-mcts-features = { path = "../ti4-mcts-features" }
serde_json = { workspace = true }

[lints]
workspace = true

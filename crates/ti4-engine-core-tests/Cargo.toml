[package]
name = "ti4-engine-core-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Oracle-free tests of the typed core (docs/todo/D4-core-tests.md): the shared typed kit (Scenario, Rig, delta, snapshots, covers!), the rule tests of the windows and the properties. A test-only crate: no production code."

# The default build holds no engine at all (neither the product crate `ti4-engine` nor the string engine
# `ti4-engine-legacy`): that is what makes these tests runnable without either. The `wrapper` feature adds the product crate (the thin
# `ti4-engine`, a facade over the legacy until D2-8; docs/todo/D2-7-legacy-split.md) and the bridge for the
# properties on real positions (D4-3) and the golden tool (D4-4).
[dependencies]
ti4-engine-core.workspace = true
# The chance resolver: the rig and the windows' tests answer the core's chance questions (lane C3).
ti4-engine-chance.workspace = true
ti4-chance.workspace = true
ti4-engine-core-factions.workspace = true
proptest.workspace = true
ti4-engine = { workspace = true, optional = true }
ti4-engine-core-bridge = { path = "../ti4-engine-core-bridge", optional = true }
ti4-model = { workspace = true, optional = true }
ti4-content = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
wrapper = ["dep:ti4-engine", "dep:ti4-engine-core-bridge", "dep:ti4-model", "dep:ti4-content", "dep:serde_json"]

[lints]
workspace = true

[[test]]
name = "wrapper_props"
required-features = ["wrapper"]

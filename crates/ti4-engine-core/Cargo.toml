[package]
name = "ti4-engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Prototype (docs/ENGINE_CORE.md): the typed rules core with no string ids; board, adjacency and movement reachability only."

# No runtime dependencies at all: no strings, no serde, no content loader. The corpus becomes typed
# tables at build time, read through ti4-content's own parser so both sides see the same data.
[dependencies]

[build-dependencies]
ti4-content.workspace = true
ti4-model.workspace = true
strum.workspace = true

[features]
# The id -> text tables, for the adapter only. The core never reads them.
names = []

[lints]
workspace = true

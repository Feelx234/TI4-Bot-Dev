name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning that reaches main is a warning nobody will ever fix.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    # Windows is the supported runtime platform (MASTER_PLAN, quality gates).
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Docs
        run: cargo doc --workspace --no-deps

      # The corpus is committed byte-identical and checksummed. If it drifts, every
      # content-derived test is measuring something other than the pinned data.
      - name: Verify content corpus checksums
        shell: bash
        run: |
          cd crates/ti4-content/content
          sha256sum --check --ignore-missing CHECKSUMS.sha256

  wasm:
    # The browser build of the engine and the game host (ti4-wasm): it must keep compiling for
    # wasm32-unknown-unknown (no clock, no threads, no tokio in the shared crates), stay inside
    # its size budget, and play a game in a real WebAssembly instance with JSPI.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - uses: actions/setup-node@v4
        with:
          # JSPI (WebAssembly.Suspending) is on by default from Node 24 (V8 13.6).
          node-version: 24

      - name: Shared crates compile for the browser
        run: |
          cargo check -p ti4-host --target wasm32-unknown-unknown
          cargo check -p ti4-wasm --target wasm32-unknown-unknown

      - name: Build
        run: cargo build -p ti4-wasm --target wasm32-unknown-unknown --profile wasm-release

      - name: Size gate
        run: node scripts/wasm-size-gate.mjs target/wasm32-unknown-unknown/wasm-release/ti4_wasm.wasm

      - name: Play a game in WebAssembly
        run: node crates/ti4-wasm/js/host.mjs target/wasm32-unknown-unknown/wasm-release/ti4_wasm.wasm

      - name: The page decodes what the hosted game sends
        working-directory: web
        run: |
          npm ci
          node ../crates/ti4-wasm/js/host.mjs ../target/wasm32-unknown-unknown/wasm-release/ti4_wasm.wasm --record "$RUNNER_TEMP/stream.json"
          TI4_HOSTED_STREAM="$RUNNER_TEMP/stream.json" npx vitest run src/protocol/hostedStream.test.ts

      - name: Hosted game, native tests
        run: cargo test -p ti4-wasm --release

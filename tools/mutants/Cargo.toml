[package]
name = "ti4-mutants"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dev tool (not a workspace member): rewrites chosen Rust files so ONE build holds many mutants behind a runtime switch (docs/ENGINE_COMPUTE.md)."

[workspace]

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
quote = "1"

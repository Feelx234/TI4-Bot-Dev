# The pinned libtorch (M09-025). Relative to this file's parent, so the pin travels with the
# repository rather than depending on a machine-specific absolute path or a shell export.
#
# The directory itself is gitignored (`/out/`) and is reproduced from
# `plans/artifacts/libtorch-2.9.1-cpu.manifest.json`, which pins every file by SHA-256.
[env]
LIBTORCH = { value = "out/libtorch-2.9.1-cpu", relative = true }

[alias]
# `cargo xtask gen-cards [--check]`: the content generator (docs/CONTENT_GENERATOR.md).
xtask = "run -q -p xtask --"
# The crates the browser game is made of, and nothing else: no libtorch, no policy or training
# crates. One fixed package set, and every alias builds test targets, so all of them resolve the
# same dependency features and share one build of the engine. A command with another package set
# (`cargo test -p ti4-engine-core`, `cargo build -p ti4-server`) resolves other features and builds the
# engine and everything above it a second time: use the aliases, and narrow a test run with a
# filter (`cargo t-web undo::`). `t-web` names its targets because a bare `cargo test` also links
# every example.
# The legacy string engine (package `ti4-engine-legacy`, directory `crates/ti4-engine`) is NOT in this
# set: it is a dev/oracle crate, built only through `t-legacy`, `c-dev`/`t-dev` and the bridge
# (docs/ENGINE_LAYOUT.md).
# Use `l-web` for every check: Clippy includes the check, and `c-web` builds a second set of
# metadata of the game crates (it shares nothing with `l-web` or `t-web`). `c-web` stays only so
# that old references to it still work.
c-web = "check -p ti4-model -p ti4-content -p ti4-calc -p ti4-engine -p ti4-host -p ti4-rule-bot -p ti4-server -p ti4-wasm --all-targets"
l-web = "clippy -p ti4-model -p ti4-content -p ti4-calc -p ti4-engine -p ti4-host -p ti4-rule-bot -p ti4-server -p ti4-wasm --all-targets"
# The fast tier: a test whose name starts with `slow_` is left out (each takes 3 s or more in a
# debug build; together they are 90% of the test time). A bare `cargo test` still runs them all.
t-web = "test -p ti4-model -p ti4-content -p ti4-calc -p ti4-engine -p ti4-host -p ti4-rule-bot -p ti4-server -p ti4-wasm --lib --tests -- --skip ::slow_"
# The slow tier, and only it: the tests of the server and of the wasm host whose names start with
# `slow_`. The game crates are optimized a little (opt-level 1): these tests run about 2.5 times
# faster, and the engine takes several times longer to build, so this is for the gate before a
# push and not for the inner loop. Not incremental: it is run seldom, and the cache of an
# optimized engine is large. Nearly all dependencies are shared with the other aliases.
t-web-slow = [
    "test",
    "--config", "profile.dev.incremental=false",
    "--config", "profile.dev.package.ti4-model.opt-level=1",
    "--config", "profile.dev.package.ti4-content.opt-level=1",
    "--config", "profile.dev.package.ti4-engine-core.opt-level=1",
    "--config", "profile.dev.package.ti4-engine-core-factions.opt-level=1",
    "--config", "profile.dev.package.ti4-engine.opt-level=1",
    "--config", "profile.dev.package.ti4-host.opt-level=1",
    "--config", "profile.dev.package.ti4-rule-bot.opt-level=1",
    "--config", "profile.dev.package.ti4-policy.opt-level=1",
    "-p", "ti4-server", "-p", "ti4-wasm", "--lib", "--test", "it", "--", "::slow_",
]
# Writes the TypeScript types of the wire into `web-shared/src/wire/generated/` (`ti4_wasm::wire_ts`),
# the messages of `fixtures/protocol/` and the catalogue of `fixtures/catalog/`: the tests that check them, with `TI4_WRITE_WIRE=1`. The
# package set and the targets of `t-web`, so it builds nothing that `t-web` has not built.
wire-web = [
    "test",
    "--config", "env.TI4_WRITE_WIRE=\"1\"",
    "-p", "ti4-model", "-p", "ti4-content", "-p", "ti4-calc", "-p", "ti4-engine", "-p", "ti4-host",
    "-p", "ti4-rule-bot", "-p", "ti4-server", "-p", "ti4-wasm",
    "--lib", "--tests", "--", "--exact", "wire_types::generated_wire_types_are_current",
    "protocol_fixtures::protocol_fixtures_are_current", "fixtures_verification::ensure_and_verify_fixtures",
    "catalog_fixture::catalog_fixture_is_current",
]
# `target/debug/server` for the e2e and the transport tests of web2. The test target (`refusals`, a small
# test of ti4-host; it was `content_ids_resolve` of the legacy crate, which left this set) is named only
# so that the features are those of `t-web`; without it the engine is built again.
b-web = "build -p ti4-model -p ti4-content -p ti4-calc -p ti4-engine -p ti4-host -p ti4-rule-bot -p ti4-server -p ti4-wasm --bin server --test refusals"

# ---- Legacy and oracle tests (not the production set; docs/ENGINE_LAYOUT.md) ----
# The legacy string engine's own tests and the content-ids test. The oracle and the lockstep profile
# (Cargo.toml: `cargo test --profile lockstep -p ti4-engine-legacy --lib`) still need it until D4.
t-legacy = "test -p ti4-engine-legacy --lib --tests -- --skip ::slow_"
# The dev-tool set: legacy, the typed core, its factions, the bridge and the oracle-free core tests.
# One fixed package set so that the dev feature set (legacy linked, as the bridge needs it) is the
# same in every dev command and shares one build. Never mix it with the web aliases in one command.
c-dev = "check -p ti4-engine-legacy -p ti4-engine-core -p ti4-engine-core-factions -p ti4-engine-core-bridge -p ti4-engine-core-tests --all-targets"
t-dev = "test -p ti4-engine-legacy -p ti4-engine-core -p ti4-engine-core-factions -p ti4-engine-core-bridge -p ti4-engine-core-tests --lib --tests -- --skip ::slow_"
